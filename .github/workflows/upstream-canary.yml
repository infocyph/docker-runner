name: Upstream Canary

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-canary
  cancel-in-progress: true

jobs:
  canary:
    name: Fresh upstream amd64 and arm64 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Fresh amd64 build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          push: false
          tags: infocyph/runner:canary-amd64

      - name: Record resolved upstreams
        env:
          IMAGE: infocyph/runner:canary-amd64
        run: |
          set -euo pipefail
          alpine_version="$(docker run --rm --entrypoint cat "$IMAGE" /etc/alpine-release)"
          chromacat_version="$(docker run --rm --entrypoint chromacat "$IMAGE" --version | head -n 1)"
          banner_sha256="$(docker run --rm --entrypoint sha256sum "$IMAGE" /usr/local/bin/show-banner | awk '{print $1}')"
          scriptomatic_main="$(git ls-remote https://github.com/infocyph/Scriptomatic.git refs/heads/main | awk '{print $1}')"
          toolset_release="$(curl -fsSL https://api.github.com/repos/infocyph/Toolset/releases/latest | jq -r .tag_name)"
          {
            echo '## Fresh upstream resolution'
            echo
            echo "- Alpine: \`$alpine_version\`"
            echo "- chromacat: \`$chromacat_version\`"
            echo "- Toolset latest release: \`$toolset_release\`"
            echo "- Scriptomatic main: \`$scriptomatic_main\`"
            echo "- Installed banner SHA-256: \`$banner_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: amd64 core runtime smoke
        run: |
          bash tests/standalone-smoke.sh infocyph/runner:canary-amd64
          bash tests/supervisor-smoke.sh infocyph/runner:canary-amd64
          bash tests/cron-smoke.sh infocyph/runner:canary-amd64
          bash tests/logrotate-smoke.sh infocyph/runner:canary-amd64

      - name: Fresh arm64 build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          pull: true
          no-cache: true
          push: false
          tags: infocyph/runner:canary-arm64

      - name: arm64 startup smoke
        run: |
          set -euo pipefail
          name="runner-canary-arm64-${RANDOM}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --platform linux/arm64 --name "$name" infocyph/runner:canary-arm64 >/dev/null
          for _ in $(seq 1 25); do
            if docker exec "$name" runner-healthcheck >/dev/null 2>&1; then
              docker exec "$name" supervisorctl -c /etc/supervisor/supervisord.conf status cron logrotate
              docker exec "$name" chromacat --version
              exit 0
            fi
            sleep 1
          done
          docker logs "$name"
          exit 1
