name: Docker Publish

on:
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish Runner
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'release' ]]; then
            RELEASE_TAG="$EVENT_RELEASE_TAG"
            PUBLISH_RELEASE_TAG=true
          else
            echo 'Scheduled/manual refresh: resolving latest published Runner release.'
            RELEASE_TAG="$(gh release list --limit 1 --json tagName -q '.[0].tagName')"
            PUBLISH_RELEASE_TAG=false
          fi

          if [[ -z "$RELEASE_TAG" ]]; then
            echo 'No published Runner release found.' >&2
            exit 1
          fi

          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "PUBLISH_RELEASE_TAG=$PUBLISH_RELEASE_TAG"
          } >> "$GITHUB_ENV"

          {
            echo '## Publish resolution'
            echo
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Runner source release: \`$RELEASE_TAG\`"
            echo "- Publish immutable release tag: \`$PUBLISH_RELEASE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out exact Runner release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Capture Runner source revision
        run: echo "RUNNER_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check out LocalDevStack main
        uses: actions/checkout@v7
        with:
          repository: infocyph/LocalDevStack
          ref: main
          path: .localdevstack
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build fresh amd64 release candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          push: false
          tags: infocyph/runner:publish-candidate
          cache-to: type=gha,scope=publish-candidate,mode=max

      - name: Record candidate upstream resolution
        env:
          IMAGE: infocyph/runner:publish-candidate
        run: |
          set -euo pipefail
          alpine_version="$(docker run --rm --entrypoint cat "$IMAGE" /etc/alpine-release)"
          chromacat_version="$(docker run --rm --entrypoint chromacat "$IMAGE" --version | head -n 1)"
          banner_sha256="$(docker run --rm --entrypoint sha256sum "$IMAGE" /usr/local/bin/show-banner | awk '{print $1}')"
          scriptomatic_main="$(git ls-remote https://github.com/infocyph/Scriptomatic.git refs/heads/main | awk '{print $1}')"
          toolset_release="$(curl -fsSL https://api.github.com/repos/infocyph/Toolset/releases/latest | jq -r .tag_name)"
          {
            echo '## Candidate upstream resolution'
            echo
            echo "- Alpine: \`$alpine_version\`"
            echo "- chromacat: \`$chromacat_version\`"
            echo "- Toolset latest release: \`$toolset_release\`"
            echo "- Scriptomatic main: \`$scriptomatic_main\`"
            echo "- Installed banner SHA-256: \`$banner_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release-candidate runtime smoke
        run: |
          set -euo pipefail
          image='infocyph/runner:publish-candidate'
          bash tests/standalone-smoke.sh "$image"
          bash tests/supervisor-smoke.sh "$image"
          bash tests/cron-smoke.sh "$image"
          bash tests/logrotate-smoke.sh "$image"
          bash tests/docker-integration-smoke.sh "$image"
          bash tests/localdevstack-contract.sh "$image" .localdevstack/docker/compose/companion.yaml

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Enforce immutable release tags
        if: env.PUBLISH_RELEASE_TAG == 'true'
        env:
          VERSION_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          assert_absent() {
            local image="$1" output
            if output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              echo "Refusing to overwrite immutable release tag: $image" >&2
              return 1
            fi

            case "$output" in
              *'not found'*|*'manifest unknown'*|*'NAME_UNKNOWN'*) return 0 ;;
              *)
                echo "Could not safely verify release-tag absence for $image:" >&2
                echo "$output" >&2
                return 1
                ;;
            esac
          }

          assert_absent "docker.io/${GITHUB_REPOSITORY_OWNER}/runner:${VERSION_TAG}"
          assert_absent "ghcr.io/${GITHUB_REPOSITORY_OWNER}/runner:${VERSION_TAG}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ github.repository_owner }}/runner
            ghcr.io/${{ github.repository_owner }}/runner
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ env.PUBLISH_RELEASE_TAG == 'true' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RUNNER_SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

      - name: Build and push multi-architecture image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-candidate
          cache-to: type=gha,scope=publish-multiarch,mode=max
          provenance: mode=max
          sbom: true

      - name: Generate Docker Hub provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: docker.io/${{ github.repository_owner }}/runner
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate GHCR provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/runner
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify and summarize published image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/runner@${DIGEST}"
          docker pull --platform linux/amd64 "$image" >/dev/null
          alpine_version="$(docker run --rm --platform linux/amd64 --entrypoint cat "$image" /etc/alpine-release)"
          chromacat_version="$(docker run --rm --platform linux/amd64 --entrypoint chromacat "$image" --version | head -n 1)"
          banner_sha256="$(docker run --rm --platform linux/amd64 --entrypoint sha256sum "$image" /usr/local/bin/show-banner | awk '{print $1}')"
          {
            echo '## Published Runner image'
            echo
            echo "- Source tag: \`$RELEASE_TAG\`"
            echo "- Source revision: \`$RUNNER_SOURCE_SHA\`"
            echo "- Manifest digest: \`$DIGEST\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Published amd64 Alpine: \`$alpine_version\`"
            echo "- Published amd64 chromacat: \`$chromacat_version\`"
            echo "- Published amd64 banner SHA-256: \`$banner_sha256\`"
            echo "- BuildKit provenance: enabled (\`mode=max\`)"
            echo '- BuildKit SBOM: enabled'
            echo '- GitHub/Sigstore provenance attestations: Docker Hub + GHCR'
          } >> "$GITHUB_STEP_SUMMARY"
