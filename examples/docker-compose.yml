name: docker-runner-example

services:
  runner:
    image: infocyph/runner:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      LOGROTATE_INTERVAL: ${LOGROTATE_INTERVAL:-3600}
      LOGROTATE_FAILURE_INTERVAL: ${LOGROTATE_FAILURE_INTERVAL:-60}
    volumes:
      - ./supervisor:/etc/supervisor/conf.d:ro
      - ./cron-jobs:/etc/cron.d:ro
      - ./logs:/global/log
      - runner-supervisor-logs:/var/log/supervisor
      - runner-logrotate-state:/var/lib/logrotate

volumes:
  runner-supervisor-logs:
  runner-logrotate-state:
